<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cicle · Protótipo de triagem</title>
  <meta name="description" content="Protótipo de alta fidelidade do Cicle: triagem de resíduos com confirmação humana no tablet e painel do gestor.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="shell-top">
      <div class="brand"><span id="brand-logo"></span><b>cicle</b><span>Protótipo de alta fidelidade · triagem com confirmação humana</span></div>
      <div class="shell-actions">
        <button class="sbtn" id="net-toggle" aria-pressed="false"></button>
        <button class="sbtn" id="notes-toggle" aria-controls="notes">Sobre a tela</button>
        <button class="sbtn" id="reset"></button>
      </div>
    </header>

    <nav class="rail" id="rail" aria-label="Seções do protótipo"></nav>

    <main class="stage" id="stage">
      <div class="stage-inner" id="stage-inner">
        <div class="frame tablet" id="frame">
          <div class="device tablet" id="device" role="application" aria-label="Tela do protótipo">
            <div id="host"></div>
            <div class="toasts" id="toasts"></div>
            <div id="layer"></div>
          </div>
        </div>
      </div>
    </main>

    <aside class="notes" id="notes" aria-label="Sobre esta tela"></aside>
  </div>

  <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="live-alert" role="alert"></div>

  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
